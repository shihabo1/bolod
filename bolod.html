<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Bolod</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #ffe3ef;
        --bg-soft: #fff0f6;
        --ink: #c2185b;
        --ink-deep: #8e0e3e;
        --sub: #7a2b4d;
        --heart: #ff5c8a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #3d1226;
          --bg-soft: #4d1832;
          --ink: #ff8fb5;
          --ink-deep: #ffc2d6;
          --sub: #f3b8cd;
          --heart: #ff7ba3;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(120% 90% at 50% 0%, var(--bg-soft) 0%, var(--bg) 70%);
        color: var(--ink);
        overflow: hidden;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
        gap: 14px;
      }
      .word {
        margin: 0;
        font-size: clamp(84px, 30vw, 220px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--ink-deep);
        text-shadow: 0 6px 0 rgba(255, 92, 138, 0.25);
        animation: pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .word .face {
        display: inline-block;
        font-size: 0.62em;
        vertical-align: 0.12em;
        margin-left: 0.08em;
      }
      .line {
        margin: 0;
        font-size: clamp(22px, 6.4vw, 40px);
        font-weight: 700;
        color: var(--ink);
        animation: rise 0.6s ease 0.25s both;
      }
      .hearts {
        font-size: clamp(20px, 5.5vw, 30px);
        letter-spacing: 0.35em;
        color: var(--heart);
        animation: rise 0.6s ease 0.45s both;
      }
      @keyframes pop {
        from { transform: scale(0.4); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes rise {
        from { transform: translateY(14px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .word, .line, .hearts { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="word">bolod<span class="face" aria-hidden="true">😂</span></h1>
      <p class="line">porer 3 number link a ja</p>
      <p class="hearts" aria-hidden="true">💖 💖 💖</p>
    </main>
  </body>
</html>
